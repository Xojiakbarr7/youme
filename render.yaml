services:
  - type: web
    name: youme-security-shop
    runtime: node
    plan: starter
    buildCommand: "npm install --omit=dev"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: youme-data
      mountPath: /var/data
      sizeGB: 1
